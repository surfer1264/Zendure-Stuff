- number:
  - name: "Zendure Setpoint"
    unique_id: zdmc_setpoint
    state: "{{ states('sensor.zdmc_setpoint') | float(0) }}"
    availability: "{{ states('sensor.zdmc_setpoint') not in ['unknown','unavailable'] }}"
    min: -40
    max: 40
    step: 5
    unit_of_measurement: "W"
    icon: mdi:transmission-tower
    set_value:
      - action: rest_command.zdmc_kvs_set
        data:
          key: zdmc_setpoint
          value: "{{ value | int }}"
      - delay: "00:00:01"
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.zdmc_setpoint

  - name: "Zendure Fixed"
    unique_id: zdmc_dischargefixed
