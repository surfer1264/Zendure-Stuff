- switch:
  - name: "Zendure dev1 Entladen erlaubt"
    unique_id: zdmc_dev1_discharge_allowed
    state: "{{ states('sensor.zdmc_dev1_dischargeallowed') | int(0) > 0 }}"
    availability: "{{ states('sensor.zdmc_dev1_dischargeallowed') not in ['unknown','unavailable'] }}"
    icon: mdi:battery-arrow-down
    turn_on:
      - action: rest_command.zdmc_kvs_set
        data: { key: zdmc_dev1_dischargeAllowed, value: 1 }
