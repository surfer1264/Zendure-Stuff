          <th></th><th style="padding:6px;">${t('upd_col_script')}</th><th style="padding:6px;">${t('upd_col_installed')}</th>
          <th style="padding:6px;">${t('upd_col_available')}</th><th style="padding:6px;">${t('upd_col_status')}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${appLine}
    <h2 style="margin-top:20px;">${t('upd_question')}</h2>
    <div class="copy-row" style="justify-content:flex-start;">
      <button class="btn btn-primary" onclick="startUpdate()" ${any && !u.busy ? '' : 'disabled'}>${u.updating ? '<span class="spinner"></span>' + t('upd_btn_running') : t('upd_btn_now')}</button>
      <span class="hint" id="updProgress" style="margin:0;">${u.updating && u.progress ? escapeHtml(u.progress) : (any ? '' : t('upd_none_selected'))}</span>
    </div>
    <div id="updSteps">${renderUpdSteps()}</div>`;
}

async function checkUpdates(){
  const u = state.upd;
  u.busy = true; u.checking = true; u.error = ''; render();
  let manifest = null;
  try { manifest = await loadManifest(); }
  catch(e){ u.error = t('upd_manifest_err', {msg: e.message}); }
  const scripts = (manifest && manifest.scripts) || {};
  const rows = {};
  for(const key of ['ctrl', 'zdw']){
    const ip = (state.runtime[KEY_ROLE[key]] || '').trim();
    const m = scripts[KEY_TYPES[key]] || {};
    const r = { ip: ip, available: m.version || null, changes: m.changes || [], changelogUrl: m.changelogUrl || null,
                installed: null, status: 'noip', selectable: false };
    if(isValidIp(ip)){
      try{
        const list = (await helperGet('/api/inspect?ip=' + encodeURIComponent(ip))).scripts || [];
        const matching = list.filter(function(s){ return s.type === KEY_TYPES[key]; });
        if(list.length === 0) r.status = 'missing';
        else if(matching.length === 1){
          // Weitere (fremde) Scripte blockieren das Update nicht - beim
          // Hochladen kommt dafuer die Rueckfrage "Alle entfernen und
          // installieren" (nur ein Script pro Shelly).
          r.extra = list.length - 1;
          r.installed = matching[0].version || '?';
          if(!r.available) r.status = 'unknown';
          else {
            const c = compareVersions(r.installed, r.available);
            r.status = c < 0 ? 'outdated' : (c === 0 ? 'current' : 'newer');
          }
          r.selectable = !!r.available;
        } else r.status = 'unclear';
      } catch(e){ r.status = e.authCancelled ? 'auth' : 'unreachable'; }
    }
    rows[key] = r;
    u.selected[key] = r.status === 'outdated';
  }
  u.rows = rows;
  u.app = manifest && manifest.scripts && manifest.scripts['zdmc-configurator'] ? manifest.scripts['zdmc-configurator'].version : null;
  u.checked = true; u.busy = false; u.checking = false;
  render();
}

// Fortschritt beim Update: je Script eine Zeile (warten / laeuft / fertig /
// Fehler) plus Abschluss. Wird ohne komplettes render() aktualisiert.
function renderUpdSteps(){
  const u = state.upd;
  if(!u.steps || !u.steps.length) return '';
  const icon = { wait: '<span style="opacity:.45;">○</span>', run: '<span class="spinner"></span>',
                 ok: '<span style="color:var(--accent-text);">✓</span>', err: '<span style="color:var(--danger);">✗</span>' };
  return `<ul style="list-style:none; padding:0; margin:12px 0 0; font-size:.88rem;">` +
    u.steps.map(function(st){
      return `<li style="display:flex; gap:8px; align-items:center; padding:3px 0; ${st.state === 'wait' ? 'color:var(--muted);' : ''}">
        <span style="width:18px; display:inline-flex; justify-content:center;">${icon[st.state]}</span>${escapeHtml(st.label)}</li>`;
    }).join('') + '</ul>';
}
function setUpdStep(i, st){
  const u = state.upd;
  if(u.steps[i]) u.steps[i].state = st;
  const el = document.getElementById('updSteps');
  if(el) el.innerHTML = renderUpdSteps();
}

async function startUpdate(){
  const u = state.upd;
  const keys = ['ctrl', 'zdw'].filter(function(k){ return u.selected[k] && u.rows[k] && u.rows[k].selectable; });
  if(!keys.length) return;
  u.steps = keys.map(function(key){
    return { state: 'wait', label: t('upd_step_read', {name: KEY_NAMES[key], ip: u.rows[key].ip}) };
  });
  u.steps.push({ state: 'wait', label: t('upd_step_apply') });
  u.busy = true; u.updating = true; u.error = ''; u.progress = t('upd_progress_start'); render();
  const setProgress = function(text){
    u.progress = text;
    const el = document.getElementById('updProgress');
    if(el) el.textContent = text;
  };
  const pause = function(ms){ return new Promise(function(r){ setTimeout(r, ms); }); };
  // Frischer Stand: nur die gewaehlten Scripte landen im Ergebnis
  state.products = { controller: false, api: false, watchdog: false };
  state.controllerAdvanced = {}; state.zdwAdvanced = {};
  state.devices = [];
  let current = 0;
  try{
    // Controller zuerst: seine Config ist fuer die Geraetedetails fuehrend
    for(let i = 0; i < keys.length; i++){
      const key = keys[i];
      current = i;
      setUpdStep(i, 'run');
      setProgress(t('upd_progress_read', {name: KEY_NAMES[key], ip: u.rows[key].ip, i: i + 1, n: keys.length}));
      const data = await helperGet('/api/config?ip=' + encodeURIComponent(u.rows[key].ip) + '&key=' + key);
      const res = applyConfigText(data.config);
      if(!res.ok) throw new Error(KEY_NAMES[key] + ': ' + res.error);
      setUpdStep(i, 'ok');
      await pause(300);   // damit jeder Schritt sichtbar ist
    }
    current = keys.length;
    setUpdStep(current, 'run');
    setProgress(t('upd_progress_done'));
    await pause(700);
    setUpdStep(current, 'ok');
    await pause(300);
  } catch(e){
    setUpdStep(current, 'err');
    u.busy = false; u.updating = false; u.progress = '';
    u.error = t('upd_err_cfg', {msg: e.message});
    render();
    return;
  }
  u.busy = false; u.updating = false; u.progress = ''; u.steps = [];
  state.updateReady = true;
  state.navError = '';
  stepIndex = computeStepList().indexOf('result');
  render();
  window.scrollTo(0, 0);
}

// Vom lokalen Helfer gemerkte Shelly-IPs (zendure_helper_config.json,
// geschrieben nach jedem erfolgreichen Upload). Fuellt beim Start nur
// LEERE IP-Felder - Eingaben des Nutzers und eine spaeter eingelesene
// Config (runtime-Block, applyRuntime) haben immer Vorrang. Laeuft der
// Helfer nicht, passiert nichts.
async function loadHelperSettings(){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 800);
    const res = await fetch(HELPER_URL + '/api/settings', { signal: ctrl.signal });
    clearTimeout(timer);
    if(!res.ok) return;
    const data = await res.json();
    helperSettings = data || {};
    let changed = computeStepList()[stepIndex] === 'start';
    ['ctr_kvs', 'apidash_watch'].forEach(function(k){
      if(!state.runtime[k] && isValidIp(data[k])){
        state.runtime[k] = data[k].trim();
        changed = true;
      }
    });
    if(changed) render();
  } catch(e){ /* Helfer nicht erreichbar oder alte Version ohne /api/settings */ }
}

// Direkt-Upload ueber den lokalen Helfer. Regel: pro Shelly genau EIN
// Script. Der Helfer prueft den Bestand selbst; ist der Shelly nicht leer
// und liegt dort nicht genau ein Script vom gleichen Typ, veraendert er
// nichts und meldet needs_confirm. Erst nach Klick auf "Alle entfernen
// und installieren" geht derselbe Upload mit force + confirm_ids erneut
// raus (confirm_ids = die angezeigten Scripte - hat sich der Bestand
// inzwischen geaendert, fragt der Helfer erneut).
const SCRIPT_TYPE_LABELS = { 'zdmc-controller': 'type_ctrl', 'zdmc-zendash-watch': 'type_zdw' };
function scriptTypeLabel(type){ return type && SCRIPT_TYPE_LABELS[type] ? t(SCRIPT_TYPE_LABELS[type]) : t('type_unknown'); }

async function directUpload(key, confirmIds, deleteOthers){
  const ip = (targetIp(key) || '').trim();
  const statusEl = document.getElementById('uploadStatus_' + key);
  const confirmEl = document.getElementById('uploadConfirm_' + key);
  const btn = document.getElementById('uploadBtn_' + key);
  confirmEl.innerHTML = '';
  if(!isValidIp(ip)){
    statusEl.textContent = t('upload_err_ip');
    statusEl.className = 'error';
    return;
  }
  statusEl.textContent = t('upload_loading', {ip: ip});
  statusEl.className = 'hint';
  if(btn) btn.disabled = true;
  try{
    const merged = await fetchMergedScript(key);
    // Sicherheitsnetz: ein aelterer Helfer kennt "behalten" nicht und
    // wuerde stattdessen alle Scripte loeschen - dann gar nicht erst senden.
    if(confirmIds && deleteOthers === false && !helperHas('keep_others')) throw new Error(t('helper_outdated'));
    const payload = { ip: ip, name: UPLOAD_NAMES[key], code: merged, key: key };
    if(confirmIds){ payload.force = true; payload.confirm_ids = confirmIds; payload.delete_others = deleteOthers !== false; }
    const { res, data } = await helperFetch('/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(data.needs_confirm){
      statusEl.textContent = '';
      showUploadConfirm(key, ip, data);
      return;
    }
    if(data.error_code === 'incomplete'){
      statusEl.textContent = t('upload_incomplete', {msg: data.error || ''});
      statusEl.className = 'error';
      return;
    }
    if(!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
    if(!data.running){
      statusEl.textContent = t('upload_not_running', {ip: ip});
      statusEl.className = 'error';
      return;
    }
    statusEl.textContent = t(data.action === 'updated' ? 'upload_success_updated' : 'upload_success', {ip: ip, id: data.id}) +
      (data.kept_others ? ' ' + t('upload_kept_others', {n: data.kept_others}) : '');
  } catch(e){
    statusEl.textContent = t('upload_error', {msg: e.message});
    statusEl.className = 'error';
  } finally {
    if(btn) btn.disabled = false;
  }
}

function showUploadConfirm(key, ip, data){
  const confirmEl = document.getElementById('uploadConfirm_' + key);
  const scripts = data.scripts || [];
  let intro;
  if(data.reason === 'wrong_type'){
    intro = t('upload_confirm_wrong', {ip: escapeHtml(ip), found: escapeHtml(scriptTypeLabel(scripts[0] && scripts[0].type)), expected: escapeHtml(scriptTypeLabel(data.expected_type))});
  } else if(data.reason === 'multiple'){
    intro = t('upload_confirm_multiple', {ip: escapeHtml(ip), n: scripts.length});
  } else {
    intro = t('upload_confirm_foreign', {ip: escapeHtml(ip)});
  }
  const rows = scripts.map(function(s){
    const ver = s.version ? ' ' + escapeHtml(s.version) : '';
    const state = s.running ? t('upload_script_running') : t('upload_script_stopped');
    const target = s.id === data.target_id ? ' – <b>' + t('upload_script_target') + '</b>' : '';
    return '<li>#' + escapeHtml(String(s.id)) + ' „' + escapeHtml(s.name || '—') + '“ – ' +
      escapeHtml(scriptTypeLabel(s.type)) + ver + ' (' + state + ')' + target + '</li>';
  }).join('');
  const helperCanKeep = helperHas('keep_others');
  const keepPossible = data.keep_possible !== false && helperCanKeep;
  pendingConfirm[key] = scripts.map(function(s){ return s.id; });
  confirmEl.innerHTML =
    '<div style="margin-top:12px; padding:12px 14px; border-radius:8px; background:var(--warn-bg); color:var(--warn); font-size:.88rem;">' +
      '<p style="margin:0 0 6px; font-weight:600;">⚠ ' + intro + '</p>' +
      '<p style="margin:0 0 4px;">' + t('upload_confirm_list') + '</p>' +
      '<ul style="margin:0 0 8px; padding-left:20px;">' + rows + '</ul>' +
      '<p style="margin:0 0 6px;">' + t('upload_confirm_rule') + '</p>' +
      '<p style="margin:0 0 10px; font-weight:600;">' + t('upload_confirm_question') + '</p>' +
      '<div class="copy-row" style="justify-content:flex-start; margin:0;">' +
        '<button class="btn btn-primary" onclick="confirmUpload(\'' + key + '\', true)">' + t('btn_upload_delete_others') + '</button>' +
        '<button class="btn" ' + (keepPossible ? '' : 'disabled ') + 'onclick="confirmUpload(\'' + key + '\', false)">' + t('btn_upload_keep_others') + '</button>' +
        '<button class="btn" onclick="cancelUpload(\'' + key + '\')">' + t('btn_upload_cancel') + '</button>' +
      '</div>' +
      (keepPossible ? '' : '<p style="margin:8px 0 0;">' + t(helperCanKeep ? 'upload_keep_impossible' : 'helper_outdated') + '</p>') +
    '</div>';
}

const pendingConfirm = {};
function confirmUpload(key, deleteOthers){
  const ids = pendingConfirm[key];
  delete pendingConfirm[key];
  if(ids) directUpload(key, ids, deleteOthers);
}

function cancelUpload(key){
  delete pendingConfirm[key];
  document.getElementById('uploadConfirm_' + key).innerHTML = '';
  const statusEl = document.getElementById('uploadStatus_' + key);
  statusEl.textContent = t('upload_cancelled');
  statusEl.className = 'hint';
}

const MEM_TOTAL_OK = 25000;   // Gesamtspeicher (frei + belegt) ab dem alles passt
async function checkMemory(){
  const ip = (document.getElementById('memCheckIp').value || '').trim();
  const statusEl = document.getElementById('memCheckStatus');
  if(!isValidIp(ip)){
    statusEl.textContent = t('upload_err_ip');
    statusEl.className = 'error';
    return;
  }
  statusEl.textContent = t('memcheck_loading', {ip: ip});
  statusEl.className = 'hint';
  try{
    const { res, data } = await helperFetch('/api/memcheck?ip=' + encodeURIComponent(ip));
    if(!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));
    const fmt = function(n){ return Number(n || 0).toLocaleString(state.lang === 'en' ? 'en-US' : 'de-DE'); };
    if(typeof data.mem_total === 'number'){
      // Neuer Helfer: Gesamtspeicher = frei + von laufenden Scripten belegt
      const ok = data.mem_total >= MEM_TOTAL_OK;
      let text = t(ok ? 'memcheck_total_ok' : 'memcheck_total_low', {ip: ip, total: fmt(data.mem_total)});
      if(data.running && data.running.length){
        text += ' ' + t('memcheck_used', {
          used: fmt(data.mem_used), free: fmt(data.mem_free),
          scripts: data.running.map(function(r){
            return '„' + (r.name || ('#' + r.id)) + '“' + (data.running.length > 1 ? ' ' + fmt(r.mem_used) : '') +
              (typeof r.mem_peak === 'number' ? ' (' + t('memcheck_peak') + ' ' + fmt(r.mem_peak) + ')' : '');
          }).join(', ')
        });
      }
      statusEl.textContent = text;
      statusEl.className = ok ? 'hint' : 'error';
    } else {
      const key = (data.mem_free >= 25200) ? 'memcheck_ok' : 'memcheck_low';
      statusEl.textContent = t(key, {ip: ip, mem_free: data.mem_free});
      statusEl.className = (data.mem_free >= 25200) ? 'hint' : 'error';
    }
  } catch(e){
    statusEl.textContent = t('memcheck_error', {msg: e.message});
    statusEl.className = 'error';
  }
}

function renderResult(){
  const p = state.products;
  const names = { controller: 'Controller', api: 'zenDash-API', watchdog: 'Watchdog' };
  const row = (label, value) => `<div><b>${label}</b> ${value}</div>`;

  let html = state.updateReady ? `<div class="panel"><p class="note" style="margin:0;">${t('result_update_hint')}</p></div>` : '';
  html += `
  <div class="panel">
    <h2>${t('result_h2')}</h2>
    <div class="summary-list">`;
  html += row(t('result_products'), ['controller','api','watchdog'].filter(k=>p[k]).map(k=>names[k]).join(', '));
  if(needsCtrIp()) html += row(t('result_ip_ctr'), escapeHtml(state.runtime.ctr_kvs || '—'));
  if(needsDashIp()) html += row(t('result_ip_dash'), escapeHtml(state.runtime.apidash_watch || '—'));
  if(p.controller) html += row(t('result_ver_ctrl'), `<span id="ver_ctrl">${t('ver_loading')}</span>`);
  if(p.api) html += row(t('result_ver_api'), `<span id="ver_api">${t('ver_loading')}</span>`);
  if(p.watchdog) html += row(t('result_ver_wd'), `<span id="ver_wd">${t('ver_loading')}</span>`);
  html += row(t('result_devices'), `${state.devices.length} — ${escapeHtml(state.devices.map(d=>d.label||'?').join(', '))}`);
  if(p.watchdog) html += row(t('result_watch'), escapeHtml(state.devices.filter(d=>d.wdEnabled!==false).map(d=>d.label||'?').join(', ') || '—'));
  if(p.watchdog) html += row(t('result_wd'), t('result_wd_value', {vs: wdVal('vollSchwelle'), er: wdVal('entladeReset'),
    vw: wdVal('minVoltWarn'), vr: wdVal('minVoltReset'), tw: wdVal('tempWarn'), tr: wdVal('tempReset')}));

  if(needsGrid()) html += row(t('result_gridsource'), escapeHtml(gridSourceSummary()));
  if(needsFullDevice()){
    const chargingText = state.chargingEnabled===true
      ? t('result_charging_yes', {list: state.devices.filter(d=>d.reverse).map(d=>d.label).join(', ') || t('result_charging_none')})
      : t('result_no');
    html += row(t('result_charging'), escapeHtml(chargingText));
  }
  if(needsSignal()){
    const sigText = state.signalEnabled===true ? t('result_signal_yes', {typ: state.signalTyp}) : t('result_no');
    html += row(t('result_signal'), sigText);
  }
  if(p.controller){
    const grmMap = {dynamic:t('result_grm_dynamic'), always1:t('result_grm_always1'), always2:t('result_grm_always2')};
    html += row(t('result_grm'), grmMap[state.gridReverseMode] || '—');
    html += row(t('result_kvs'), state.kvsEnabled===true ? t('result_yes') : t('result_no'));
    const r = regel();
    html += row(t('result_regel'), t('result_regel_value', {sp: r.setpoint, hy: r.hysteresis, dc: r.dConc, ds: r.dSpread, cc: r.cConc, cs: r.cSpread}));
  }
  html += row(t('result_rest'), t('result_rest_value'));
  html += `
    </div>
    ${ needsDashIp() ? `<div class="note">${t('result_legacy_note')}</div>` : '' }
  </div>`;

  if(p.controller) html += resultBlock('Controller', 'ctrl', buildControllerConfig(), 'hint_ctrl');
  if(needsDashIp()) html += resultBlock('zenDash-API + Watchdog', 'zdw', buildZdwConfig(), 'hint_zdw');

  if(anyProduct()) html += uploadGuideBlock();
  html += memCheckBlock();

  return html;
}

// ---------- Rendering / Navigation ----------
function renderStepDots(steps){
  const labels = stepLabels();
  const el = document.getElementById('steps');
  el.innerHTML = "";
  steps.forEach((id, i)=>{
    const d = document.createElement('div');
    d.className = 'step-dot' + (i===stepIndex ? ' active' : (i<stepIndex ? ' done' : ''));
    d.textContent = (i+1) + '. ' + labels[id];
    el.appendChild(d);
  });
}

function renderStepById(id){
  switch(id){
    case 'start': return renderStart();
    case 'products': return renderProducts();
    case 'devices': return renderDevices();
    case 'gridsource': return renderGridSource();
    case 'charging': return renderCharging();
    case 'signal': return renderSignal();
    case 'ctrl_gridreverse': return renderCtrlGridReverse();
    case 'ctrl_kvs': return renderCtrlKvs();
    case 'regel': return renderRegel();
    case 'wd_thresholds': return renderWdThresholds();
    default: return renderResult();
  }
}

// Liefert '' wenn der Schritt vollstaendig ist, sonst den i18n-Schluessel
// der Fehlermeldung.
function validateStepById(id){
  switch(id){
    case 'start': return state.mode ? '' : 'nav_err_mode';
    case 'products': {
      if(!anyProduct()) return 'nav_err_products';
      const c = (state.runtime.ctr_kvs||'').trim(), d = (state.runtime.apidash_watch||'').trim();
      if(needsCtrIp() && !isValidIp(c)) return 'nav_err_ip_ctr';
      if(needsDashIp() && !isValidIp(d)) return 'nav_err_ip_dash';
      if(needsCtrIp() && needsDashIp() && c === d) return 'nav_err_ip_same';
      return '';
    }
    case 'devices':
      return state.devices.length > 0 && state.devices.every(d => isValidIp(d.ip) && (!needsFullDevice() || d.maxOutput>0)) ? '' : 'nav_err_generic';
    case 'gridsource':
      if(state.gridSource==='remote') return isValidIp(state.gridSourceIp) ? '' : 'nav_err_generic';
      if(state.gridSource==='http_json') return (state.gridSourceUrl && state.gridSourceUrl.indexOf('<') < 0 && gridFieldValid(state.gridSourceField)) ? '' : 'nav_err_httpjson';
      return '';
    case 'charging': return state.chargingEnabled !== null ? '' : 'nav_err_generic';
    case 'signal':
      if(state.signalEnabled === null) return 'nav_err_generic';
      if(state.signalEnabled === false) return '';
      if(state.signalTyp==='WEBHOOK') return state.signalWebhookUrl ? '' : 'nav_err_generic';
      return (state.signalPhone && state.signalApiKey) ? '' : 'nav_err_generic';
    case 'ctrl_gridreverse': return state.gridReverseMode ? '' : 'nav_err_generic';
    case 'ctrl_kvs': return state.kvsEnabled !== null ? '' : 'nav_err_generic';
    case 'regel': return regelValid() ? '' : 'nav_err_regel';
    case 'wd_thresholds': return wdThresholdsValid() ? '' : 'nav_err_wd';
    default: return '';
  }
}

function renderNav(steps){
  const isLast = stepIndex === steps.length-1;
  return `
  ${ state.navError ? `<div class="error" style="text-align:right; font-size:.85rem; margin-top:14px;">${t(state.navError)}</div>` : '' }
  <div class="nav">
    <button class="btn" onclick="back()" ${stepIndex===0?'style="visibility:hidden;"':''}>${t('navBack')}</button>
    ${ isLast || (steps[stepIndex] === 'start' && (state.mode === 'update' || state.mode === 'log')) ? "" : `<button class="btn btn-primary" onclick="next()">${t('navNext')}</button>` }
  </div>`;
}

function next(){
  const steps = computeStepList();
  const err = validateStepById(steps[stepIndex]);
  if(err){ state.navError = err; render(); return; }
  state.navError = '';
  stepIndex++;
  render();
}
function back(){
  state.navError = '';
  stepIndex--;
  if(stepIndex<0) stepIndex=0;
  render();
}

function render(){
  renderHeader();
  const steps = computeStepList();
  if(stepIndex > steps.length-1) stepIndex = steps.length-1;
  if(stepIndex < 0) stepIndex = 0;
  renderStepDots(steps);
  let html = renderStepById(steps[stepIndex]);
  html += renderNav(steps);
  document.getElementById('stepContainer').innerHTML = html;
  if(['start', 'products', 'result'].indexOf(steps[stepIndex]) !== -1) detectHelper();
  if(steps[stepIndex] === 'result') loadVersions();
}

render();
loadHelperSettings();
</script>
