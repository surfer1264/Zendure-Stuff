<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 740" width="1050" height="740" role="img" aria-label="Architecture de la Shelly Suite : matériel, fonctionnement, pilotage, installation">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888780"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
      .t{font-size:14px;font-weight:600;text-anchor:middle}
      .s{font-size:12px;text-anchor:middle}
      .l{font-size:11px;fill:#5F5E5A}
      .lc{font-size:11px;fill:#5F5E5A;text-anchor:middle}
      .ln{font-size:13px;font-weight:700}
      .lk{font-size:11px;letter-spacing:.06em}
      .f{stroke:#5F5E5A;stroke-width:1.4;fill:none}
      .d{stroke:#888780;stroke-width:1.4;fill:none;stroke-dasharray:6 4}
      .o{stroke:#888780;stroke-width:1.4;fill:none;stroke-dasharray:1.5 3.5;stroke-linecap:round}
    </style>
  </defs>

  <rect x="0" y="0" width="1050" height="740" rx="14" fill="#FCFCFA"/>

  <!-- ===== Spuren (Lanes) ===== -->
  <!-- Bedienung SW -->
  <rect x="14" y="20" width="1022" height="192" rx="10" fill="#F6F5FE" stroke="#D8D5F7"/>
  <rect x="14" y="20" width="6" height="192" rx="3" fill="#7F77DD"/>
  <text x="32" y="106" class="ln" fill="#3C3489">Pilotage</text>
  <text x="32" y="124" class="lk" fill="#534AB7">LOGICIEL</text>

  <!-- Betrieb SW -->
  <rect x="14" y="226" width="832" height="144" rx="10" fill="#F0FAF6" stroke="#C4E9DA"/>
  <rect x="14" y="226" width="6" height="144" rx="3" fill="#1D9E75"/>
  <text x="32" y="292" class="ln" fill="#085041">Fonctionnement</text>
  <text x="32" y="310" class="lk" fill="#0F6E56">LOGICIEL</text>

  <!-- Betrieb HW -->
  <rect x="14" y="384" width="832" height="110" rx="10" fill="#F2F7FD" stroke="#C9DEF4"/>
  <rect x="14" y="384" width="6" height="110" rx="3" fill="#378ADD"/>
  <text x="32" y="434" class="ln" fill="#0C447C">Fonctionnement</text>
  <text x="32" y="452" class="lk" fill="#185FA5">MATÉRIEL</text>

  <!-- Gesteuerte HW -->
  <rect x="14" y="508" width="832" height="104" rx="10" fill="#FDF7EC" stroke="#F0DDB8"/>
  <rect x="14" y="508" width="6" height="104" rx="3" fill="#BA7517"/>
  <text x="32" y="556" class="ln" fill="#633806">Piloté</text>
  <text x="32" y="574" class="lk" fill="#854F0B">MATÉRIEL</text>

  <!-- Installation SW -->
  <rect x="860" y="226" width="176" height="386" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-dasharray="6 4"/>
  <text x="948" y="252" class="ln" fill="#444441" text-anchor="middle">Installation</text>
  <text x="948" y="270" class="lk" fill="#5F5E5A" text-anchor="middle">LOGICIEL</text>

  <!-- ===== Bedienung ===== -->
  <rect x="340" y="40" width="220" height="52" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="450" y="62" class="t" fill="#3C3489">Statistiques cloud</text>
  <text x="450" y="80" class="s" fill="#534AB7">ThingSpeak / ThingsBoard, option</text>

  <rect x="620" y="40" width="220" height="52" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="730" y="62" class="t" fill="#3C3489">Dashboard (SMDC)</text>
  <text x="730" y="80" class="s" fill="#534AB7">navigateur ou appli mobile</text>

  <rect x="340" y="140" width="220" height="52" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="450" y="162" class="t" fill="#3C3489">Home Assistant</text>
  <text x="450" y="180" class="s" fill="#534AB7">option, automatisations</text>

  <rect x="620" y="140" width="220" height="52" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="730" y="162" class="t" fill="#3C3489">Proxy du tableau de bord</text>
  <text x="730" y="180" class="s" fill="#534AB7">PC, NAS ou appli HA</text>

  <rect x="878" y="140" width="140" height="52" rx="8" fill="#EEEDFE" stroke="#7F77DD"/>
  <text x="948" y="162" class="t" fill="#3C3489">Notifications</text>
  <text x="948" y="180" class="s" fill="#534AB7">Signal, WhatsApp …</text>

  <!-- ===== Betrieb Software ===== -->
  <rect x="340" y="252" width="220" height="92" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="450" y="276" class="t" fill="#085041">Script Controller</text>
  <text x="450" y="294" class="s" fill="#0F6E56">maintient le réseau à ≈ 0 W</text>
  <rect x="362" y="308" width="176" height="24" rx="5" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="450" y="324" class="s" fill="#0F6E56">KVS : consigne, réserve …</text>

  <rect x="620" y="252" width="220" height="92" rx="8" fill="#E1F5EE" stroke="#1D9E75"/>
  <text x="730" y="276" class="t" fill="#085041">Script zendash_watch</text>
  <text x="730" y="294" class="s" fill="#0F6E56">données du tableau de bord</text>
  <rect x="642" y="308" width="176" height="24" rx="5" fill="#FFFFFF" stroke="#5DCAA5"/>
  <text x="730" y="324" class="s" fill="#0F6E56">watchdog des batteries</text>

  <!-- ===== Installation ===== -->
  <rect x="878" y="300" width="140" height="92" rx="8" fill="#F1EFE8" stroke="#888780" stroke-dasharray="6 4"/>
  <text x="948" y="324" class="t" fill="#444441">Configurator</text>
  <text x="948" y="342" class="s" fill="#5F5E5A">+ assistant sur le PC</text>
  <text x="948" y="364" class="s" fill="#5F5E5A">installation et</text>
  <text x="948" y="380" class="s" fill="#5F5E5A">mises à jour</text>

  <!-- ===== Betrieb Hardware ===== -->
  <rect x="150" y="404" width="160" height="70" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="230" y="426" class="t" fill="#0C447C">Compteur</text>
  <text x="230" y="444" class="s" fill="#185FA5">Shelly Pro 3EM ou</text>
  <text x="230" y="460" class="s" fill="#185FA5">autre compteur</text>

  <rect x="385" y="404" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="460" y="430" class="t" fill="#0C447C">Shelly 1</text>
  <text x="460" y="448" class="s" fill="#185FA5">Shelly contrôleur</text>
  <text x="460" y="464" class="s" fill="#185FA5" font-style="italic">év. = Pro 3EM</text>

  <rect x="665" y="404" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#378ADD"/>
  <text x="740" y="430" class="t" fill="#0C447C">Shelly 2</text>
  <text x="740" y="448" class="s" fill="#185FA5">Shelly tableau de bord</text>

  <!-- ===== Gesteuerte Hardware ===== -->
  <rect x="352" y="524" width="488" height="60" rx="8" fill="#FAEEDA" stroke="#EF9F27" opacity=".55"/>
  <rect x="346" y="528" width="488" height="60" rx="8" fill="#FAEEDA" stroke="#EF9F27" opacity=".8"/>
  <rect x="340" y="532" width="488" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="584" y="556" class="t" fill="#633806">Batteries Zendure 1 … n</text>
  <text x="584" y="575" class="s" fill="#854F0B">en local via zenSDK, accès Internet bloquable</text>

  <!-- ===== "tourne sur" ===== -->
  <path class="o" d="M460,344 V404"/>
  <text x="468" y="378" class="l" font-style="italic">tourne sur</text>
  <path class="o" d="M740,344 V404"/>
  <text x="748" y="378" class="l" font-style="italic">tourne sur</text>

  <!-- ===== Datenflüsse im Betrieb ===== -->
  <!-- Dashboard <-> Proxy -->
  <path class="f" d="M730,94 V138" marker-start="url(#a)" marker-end="url(#a)"/>
  <!-- Proxy -> Cloud -->
  <path class="f" d="M660,140 V116 H450 V94" marker-end="url(#a)"/>
  <text x="555" y="110" class="lc">mesures 1×/min</text>
  <!-- HA <-> Controller -->
  <path class="f" d="M450,194 V250" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="458" y="222" class="l">REST · KVS</text>
  <!-- Proxy <-> zendash_watch -->
  <path class="f" d="M730,194 V250" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="738" y="222" class="l">HTTP</text>
  <!-- zendash_watch -> Meldungen -->
  <path class="f" d="M820,252 V219 H948 V194" marker-end="url(#a)"/>
  <!-- zendash_watch -> Controller KVS -->
  <path class="f" d="M620,298 H562" marker-end="url(#a)"/>
  <text x="591" y="290" class="lc">KVS.Set</text>
  <!-- Smartmeter -> Controller -->
  <path class="f" d="M230,404 V290 H338" marker-end="url(#a)"/>
  <text x="240" y="282" class="l">puissance réseau</text>
  <!-- Controller <-> Speicher -->
  <path class="f" d="M360,344 V530" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="352" y="518" class="l" text-anchor="end">consignes + report</text>
  <!-- zendash_watch <- Speicher -->
  <path class="f" d="M640,524 V346" marker-end="url(#a)"/>
  <text x="648" y="518" class="l">lit le report</text>

  <!-- ===== Installation (gestrichelt) ===== -->
  <path class="d" d="M900,392 V439 H817" marker-end="url(#ag)"/>
  <path class="d" d="M960,392 V500 H460 V476" marker-end="url(#ag)"/>
  <text x="948" y="532" class="lc">installe scripts</text>
  <text x="948" y="546" class="lc">et réglages sur</text>
  <text x="948" y="560" class="lc">les deux Shelly</text>

  <!-- ===== Legende ===== -->
  <g transform="translate(24,636)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#BA7517"/>
    <text x="20" y="12" class="l">Matériel piloté</text>
    <rect x="130" y="0" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#378ADD"/>
    <text x="150" y="12" class="l">Matériel de fonctionnement (Shelly, compteur)</text>
    <rect x="420" y="0" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#1D9E75"/>
    <text x="440" y="12" class="l">Logiciel de fonctionnement</text>
    <rect x="610" y="0" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="630" y="12" class="l">Logiciel de pilotage</text>
    <rect x="770" y="0" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-dasharray="3 2"/>
    <text x="790" y="12" class="l">Logiciel d’installation</text>

    <path class="f" d="M0,42 H36" marker-end="url(#a)"/>
    <text x="44" y="46" class="l">données en fonctionnement</text>
    <path class="d" d="M240,42 H276" marker-end="url(#ag)"/>
    <text x="284" y="46" class="l">installation / mise à jour seulement</text>
    <path class="o" d="M480,42 H516"/>
    <text x="524" y="46" class="l">script tourne sur l’appareil · un seul script par Shelly</text>

    <text x="0" y="80" class="l">Tout tourne dans le réseau local. Si le pilotage tombe, le Controller continue de réguler. Internet seulement pour statistiques, notifications et téléchargements du Configurator.</text>
  </g>
</svg>
