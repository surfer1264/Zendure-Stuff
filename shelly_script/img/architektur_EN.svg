<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 545" width="680" height="545" role="img" aria-label="Shelly Suite architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>Shelly Suite architecture</title><style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}.th{font-size:14px;font-weight:600}.ts{font-size:12px}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="679" height="544" rx="16" fill="#FFFFFF" stroke="#D3D1C7"/><rect x="40" y="30" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="130.0" y="49.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#3C3489">Dashboard (SMDC)</text><text x="130.0" y="68.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#534AB7">browser or phone</text><rect x="250" y="30" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="49.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#3C3489">Cloud statistics</text><text x="340.0" y="68.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#534AB7">optional, readings only</text><rect x="460" y="30" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="550.0" y="49.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#3C3489">Home Assistant</text><text x="550.0" y="68.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#534AB7">optional, via KVS</text><rect x="40" y="126" width="230" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="155.0" y="145.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#3C3489">Dashboard proxy</text><text x="155.0" y="164.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#534AB7">PC, NAS or HA app</text><rect x="290" y="126" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="395.0" y="145.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#3C3489">Notifications</text><text x="395.0" y="164.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#534AB7">Signal, WhatsApp, webhook</text><line x1="130" y1="88" x2="130" y2="124" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><line x1="260" y1="124" x2="260" y2="90" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="222" width="600" height="132" rx="14" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="5 4"/><rect x="64" y="262" width="260" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="194.0" y="285.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">Shelly 2: zendash_watch</text><text x="194.0" y="304.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">dashboard API + watchdog</text><rect x="380" y="262" width="236" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="498.0" y="285.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#085041">Shelly 1: Controller</text><text x="498.0" y="304.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#0F6E56">keeps grid draw at ≈ 0 W</text><line x1="326" y1="294" x2="378" y2="294" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><line x1="150" y1="184" x2="150" y2="260" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><line x1="300" y1="260" x2="300" y2="184" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><line x1="570" y1="88" x2="570" y2="260" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><rect x="40" y="410" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="4 3"/><text x="135.0" y="429.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Setup</text><text x="135.0" y="448.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">Configurator + helper</text><rect x="250" y="410" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="429.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Energy meter</text><text x="340.0" y="448.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">Pro 3EM / smart meter</text><rect x="450" y="410" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="545.0" y="429.0" text-anchor="middle" dominant-baseline="central" class="th" fill="#2C2C2A">Zendure batteries</text><text x="545.0" y="448.0" text-anchor="middle" dominant-baseline="central" class="ts" fill="#5F5E5A">zenSDK, no cloud</text><line x1="135" y1="408" x2="135" y2="330" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="405" y1="408" x2="405" y2="330" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><line x1="545" y1="330" x2="545" y2="408" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#a)"/><text x="40" y="496" dominant-baseline="central" class="ts" fill="#5F5E5A">Purple = operate and analyse · Teal = Shelly scripts · Grey = devices and tools</text><text x="40" y="518" dominant-baseline="central" class="ts" fill="#5F5E5A">Dashed frame = control in the home network, exactly one script per Shelly</text></svg>
