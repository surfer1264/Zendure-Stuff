name: "Zendure Dashboard Proxy"
version: "1.0.0"
slug: "zendure_proxy"
description: "Lokaler Proxy für das Zendure-Dashboard (löst CORS-Problem der Shelly-Firmware)"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Zendure Dashboard"