name: Build & Release lokaler Helfer

# Baut zendure_local_helper.py bei jedem veroeffentlichten GitHub-Release
# fuer Windows und macOS zu je einer einzigen ausfuehrbaren Datei
# (PyInstaller, --onefile) und haengt sie als Release-Asset an. Der
# Endnutzer laedt danach nur noch eine fertige Datei von der
# Release-Seite herunter - kein Python-Setup, kein Terminal.
#
# Anpassen: HELPER_PATH unten, falls die Datei umbenannt wird oder
# woanders liegt. Aktuell: shelly_script/local_helper/zendure_local_helper.py
# (https://github.com/surfer1264/Zendure-Stuff/tree/main/shelly_script/local_helper)
#
# Ausloeser: ein Release wird auf GitHub veroeffentlicht (Tag reicht
# nicht - "Publish release" bzw. "gh release create" ohne --draft).

"on":
  release:
    types: [published]

permissions:
  contents: write   # noetig, um Assets am Release hochzuladen

env:
  HELPER_PATH: shelly_script/local_helper/zendure_local_helper.py

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            built_path: dist/zendure_local_helper.exe
            asset_name: zendure_local_helper-windows.exe
          - os: macos-latest
            built_path: dist/zendure_local_helper
            asset_name: zendure_local_helper-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: pip install pyinstaller

      - name: Ausfuehrbare Datei bauen
        run: pyinstaller --onefile --console --name zendure_local_helper "${{ env.HELPER_PATH }}"

      - name: Asset benennen
        shell: bash
        run: cp "${{ matrix.built_path }}" "${{ matrix.asset_name }}"

      - name: An Release anhaengen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset_name }}" --clobber
