name: Build & Release lokaler Helfer

# Baut zendure_local_helper.py bei jedem veroeffentlichten GitHub-Release
# fuer Windows und macOS zu je einer einzigen ausfuehrbaren Datei
# (PyInstaller, --onefile) und haengt sie als Release-Asset an. Der
# Endnutzer laedt danach nur noch eine fertige Datei von der
# Release-Seite herunter - kein Python-Setup, kein Terminal.
#
# Anpassen: HELPER_PATH und HTML_PATH unten, falls Dateien umbenannt
# werden oder woanders liegen. Beide Pfade sind vom Nutzer bestaetigt:
# HELPER_PATH: shelly_script/local_helper/zendure_local_helper.py
# (https://github.com/surfer1264/Zendure-Stuff/tree/main/shelly_script/local_helper)
# HTML_PATH:   shelly_script/Multiconfigurator/zendure-multi-configurator_multilang.html
# (https://github.com/surfer1264/Zendure-Stuff/blob/main/shelly_script/Multiconfigurator/zendure-multi-configurator_multilang.html)
#
# Ausloeser: ein Release wird auf GitHub veroeffentlicht (Tag reicht
# nicht - "Publish release" bzw. "gh release create" ohne --draft).

"on":
  release:
    types: [published]

permissions:
  contents: write   # noetig, um Assets am Release hochzuladen

env:
  HELPER_PATH: shelly_script/local_helper/zendure_local_helper.py
  HTML_PATH: shelly_script/Multiconfigurator/zendure-multi-configurator_multilang.html

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            data_sep: ";"
            built_path: dist/zendure_local_helper.exe
            asset_name: zendure_local_helper-windows.exe
          - os: macos-latest
            data_sep: ":"
            built_path: dist/zendure_local_helper
            asset_name: zendure_local_helper-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: PyInstaller installieren
        run: pip install pyinstaller

      - name: Ausfuehrbare Datei bauen (mit gebuendelter HTML)
        # --add-data SRC{sep}DEST bettet die Configurator-HTML in die exe
        # ein; ". " als DEST legt sie direkt ins sys._MEIPASS-Wurzelverzeichnis,
        # wo resource_path() in zendure_local_helper.py sie erwartet.
        run: >-
          pyinstaller --onefile --console --name zendure_local_helper
          --add-data "${{ env.HTML_PATH }}${{ matrix.data_sep }}."
          "${{ env.HELPER_PATH }}"

      - name: Asset benennen
        shell: bash
        run: cp "${{ matrix.built_path }}" "${{ matrix.asset_name }}"

      - name: SHA-256 berechnen
        # sha256sum (Linux/Windows-Git-Bash) oder shasum -a 256 (macOS
        # Standard) - je nachdem, was auf dem Runner vorhanden ist.
        # Format "<hash>  <dateiname>" laesst sich spaeter direkt mit
        # "sha256sum -c" bzw. PowerShells Get-FileHash gegenpruefen.
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"
          fi
          cat "${{ matrix.asset_name }}.sha256"

      - name: An Release anhaengen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset_name }}" "${{ matrix.asset_name }}.sha256" --clobber
